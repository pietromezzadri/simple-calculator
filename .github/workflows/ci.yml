name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.test.outputs.coverage }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Test
        id: test
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          go tool cover -html=coverage.out -o coverage.html
          echo "coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html

  frontend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.test.outputs.coverage }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test
        id: test
        run: |
          npm test -- --coverage
          echo "coverage=$(node -p "require('./coverage/coverage-summary.json').total.statements.pct")%" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t simple-calculator .
      - name: Smoke test the image
        run: |
          docker run -d --name calculator -p 8080:8080 simple-calculator
          for attempt in $(seq 1 20); do
            curl -sf http://localhost:8080/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf -X POST http://localhost:8080/api/v1/add -d '{"a": 0.1, "b": 0.2}' | grep -q '"0.3"'

  # Publishes the coverage figures that the README's badges read. They live on
  # their own branch so that updating them doesn't add commits to main.
  badges:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish coverage badges
        env:
          BACKEND_COVERAGE: ${{ needs.backend.outputs.coverage }}
          FRONTEND_COVERAGE: ${{ needs.frontend.outputs.coverage }}
        run: |
          write_badge() {
            color=$(awk -v p="${2%\%}" 'BEGIN { print (p >= 90 ? "brightgreen" : p >= 80 ? "green" : p >= 70 ? "yellow" : p >= 60 ? "orange" : "red") }')
            printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' "$1" "$2" "$color" > "$3"
          }
          git checkout --orphan badges
          git rm -rfq .
          write_badge "backend coverage" "$BACKEND_COVERAGE" backend-coverage.json
          write_badge "frontend coverage" "$FRONTEND_COVERAGE" frontend-coverage.json
          git add backend-coverage.json frontend-coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Update coverage badges"
          git push --force origin badges
